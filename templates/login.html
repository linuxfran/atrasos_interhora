{% extends "base.html" %}
{% block title %}Iniciar sesión | Smart Attendance{% endblock %}
{% block content %}
<section class="auth-panel">
    <p class="etiqueta">ACCESO SEGURO</p>
    <h2>Iniciar sesión</h2>
    <p>Ingresa con la cuenta administradora del sistema.</p>
    <form class="auth-form" method="post" action="{{ url_for('rutas.login') }}">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
